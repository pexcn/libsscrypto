name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLATFORM_TOOLSET: v143

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Check OpenSSL
        shell: cmd
        run: |
          if not exist openssl-prebuilt-lib\x64\libcrypto.lib (
            echo openssl-prebuilt-lib\x64\libcrypto.lib is missing
            echo run the "openssl" workflow and commit its artifact
            exit /b 1
          )

      - name: Build
        shell: cmd
        run: >
          msbuild libsscrypto.sln /m /nologo
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=%PLATFORM_TOOLSET%

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libsscrypto-x64
          path: |
            x64\Release\libsscrypto*.dll
            x64\Release\libsscrypto*.pdb
          if-no-files-found: error

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path x64\Release\libsscrypto*.dll -DestinationPath libsscrypto-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: libsscrypto-x64.zip
