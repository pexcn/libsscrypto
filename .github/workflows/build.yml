name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The runner images only ship VS2022, so the v141 toolset README asks for is
  # not available -- override it for every project in the solution. libsodium
  # derives its output directory from $(PlatformToolset) and libsscrypto.vcxproj
  # follows it, so the two stay in step whatever this is set to.
  PLATFORM_TOOLSET: v143
  # CI builds libcrypto itself for both platforms rather than using whatever
  # is committed under openssl-prebuilt-lib/, so this is the version that
  # actually gets linked here. Keep it in step with
  # openssl-prebuilt-lib/README.txt.
  OPENSSL_VERSION: 3.5.8

jobs:
  build:
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        include:
          # `solution` is the platform name libsscrypto.sln uses, `platform` the
          # one the projects use -- the solution maps Release|x86 to Release|Win32.
          - solution: x86
            platform: Win32
            openssl_target: VC-WIN32
            output: Release
          - solution: x64
            platform: x64
            openssl_target: VC-WIN64A
            output: x64/Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.solution }}

      - name: Cache OpenSSL
        id: openssl
        uses: actions/cache@v6
        with:
          path: openssl-lib
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ matrix.platform }}-${{ env.PLATFORM_TOOLSET }}

      # no-apps / no-docs / no-tests cut most of the build; only libcrypto.lib is
      # needed, and only for the ten EVP_* functions libsscrypto.def re-exports.
      - name: Build OpenSSL
        if: steps.openssl.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          choco install nasm --no-progress -y || exit /b 1
          set PATH=C:\Program Files\NASM;%PATH%
          curl -fsSLo openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-%OPENSSL_VERSION%/openssl-%OPENSSL_VERSION%.tar.gz || exit /b 1
          tar -xzf openssl.tar.gz || exit /b 1
          cd openssl-%OPENSSL_VERSION% || exit /b 1
          perl Configure ${{ matrix.openssl_target }} no-shared no-apps no-docs no-tests --release || exit /b 1
          nmake build_libs || exit /b 1
          cd ..
          mkdir openssl-lib || exit /b 1
          copy /y openssl-%OPENSSL_VERSION%\libcrypto.lib openssl-lib\ || exit /b 1
          rem the pdb is optional -- do not fail the build if it was not produced
          copy /y openssl-%OPENSSL_VERSION%\ossl_static.pdb openssl-lib\

      - name: Stage OpenSSL
        shell: cmd
        run: |
          if not exist openssl-prebuilt-lib\${{ matrix.platform }} mkdir openssl-prebuilt-lib\${{ matrix.platform }} || exit /b 1
          copy /y openssl-lib\libcrypto.lib openssl-prebuilt-lib\${{ matrix.platform }}\ || exit /b 1

      # openssl-prebuilt-lib/ has to be updated by hand, so hand the freshly
      # built library out as an artifact rather than making anyone install NASM.
      - name: Upload OpenSSL artifact
        uses: actions/upload-artifact@v7
        with:
          name: openssl-${{ matrix.platform }}
          path: openssl-lib/*
          if-no-files-found: error

      - name: Build
        shell: cmd
        run: >
          msbuild libsscrypto.sln /m /nologo
          /p:Configuration=Release
          /p:Platform=${{ matrix.solution }}
          /p:PlatformToolset=%PLATFORM_TOOLSET%
          /p:WindowsTargetPlatformVersion=10.0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libsscrypto-${{ matrix.platform }}
          path: |
            ${{ matrix.output }}\libsscrypto*.dll
            ${{ matrix.output }}\libsscrypto*.pdb
          if-no-files-found: error

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.output }}\libsscrypto*.dll -DestinationPath libsscrypto-${{ matrix.platform }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: libsscrypto-${{ matrix.platform }}.zip
