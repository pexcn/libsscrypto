name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The runner images only ship VS2022, so the v141 toolset README asks for is
  # not available -- override it for every project in the solution. libsodium
  # derives its output directory from $(PlatformToolset) and libsscrypto.vcxproj
  # follows it, so the two stay in step whatever this is set to.
  PLATFORM_TOOLSET: v143

jobs:
  build:
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        include:
          # `solution` is the platform name libsscrypto.sln uses, `platform` the
          # one the projects use -- the solution maps Release|x86 to Release|Win32.
          - solution: x86
            platform: Win32
            output: Release
          - solution: x64
            platform: x64
            output: x64/Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.solution }}

      # libcrypto.lib is committed under openssl-prebuilt-lib/, so CI links
      # exactly what a local build does. Rebuilding it from source is a separate,
      # manually triggered workflow (openssl.yml); its artifact is what gets
      # copied in here. Fail loudly rather than letting the link report ten
      # unresolved EVP_* symbols.
      - name: Check OpenSSL
        shell: cmd
        run: |
          if not exist openssl-prebuilt-lib\${{ matrix.platform }}\libcrypto.lib (
            echo openssl-prebuilt-lib\${{ matrix.platform }}\libcrypto.lib is missing
            echo run the "openssl" workflow and commit its artifact
            exit /b 1
          )

      - name: Build
        shell: cmd
        run: >
          msbuild libsscrypto.sln /m /nologo
          /p:Configuration=Release
          /p:Platform=${{ matrix.solution }}
          /p:PlatformToolset=%PLATFORM_TOOLSET%
          /p:WindowsTargetPlatformVersion=10.0

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libsscrypto-${{ matrix.platform }}
          path: |
            ${{ matrix.output }}\libsscrypto*.dll
            ${{ matrix.output }}\libsscrypto*.pdb
          if-no-files-found: error

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.output }}\libsscrypto*.dll -DestinationPath libsscrypto-${{ matrix.platform }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: libsscrypto-${{ matrix.platform }}.zip
